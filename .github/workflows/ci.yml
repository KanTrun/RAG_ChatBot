name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Start test services
        run: docker compose -f docker-compose.test.yml up -d test-db test-redis
      - name: Wait for test services
        run: |
          for i in {1..30}; do
            if docker compose -f docker-compose.test.yml exec -T test-db pg_isready -U rag_test -d rag_test_db; then
              break
            fi
            if [ "$i" = "30" ]; then
              docker compose -f docker-compose.test.yml logs test-db
              exit 1
            fi
            sleep 2
          done
          for i in {1..30}; do
            if docker compose -f docker-compose.test.yml exec -T test-redis redis-cli ping; then
              break
            fi
            if [ "$i" = "30" ]; then
              docker compose -f docker-compose.test.yml logs test-redis
              exit 1
            fi
            sleep 2
          done
      - name: Install backend dependencies
        run: python -m pip install -e "backend[dev]"
      - name: Run backend tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://rag_test:rag_test@localhost:5433/rag_test_db
          DATABASE_SYNC_URL: postgresql://rag_test:rag_test@localhost:5433/rag_test_db
          REDIS_URL: redis://localhost:6380/0
          NEXTAUTH_SECRET: test-secret
        run: pytest backend/tests -m "not integration" --cov=backend/app --cov-report=xml
      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run component tests
        working-directory: frontend
        run: npm run test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && vars.E2E_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: "1"
          PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
