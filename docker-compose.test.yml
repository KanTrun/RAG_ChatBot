services:
  test-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag_test
      POSTGRES_PASSWORD: rag_test
      POSTGRES_DB: rag_test_db
    ports:
      - "5433:5432"
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_test -d rag_test_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rag-test-net

  test-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rag-test-net

networks:
  rag-test-net:
    driver: bridge
