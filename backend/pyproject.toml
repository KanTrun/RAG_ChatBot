[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG Chatbot Backend - FastAPI"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.128,<0.129",
    "uvicorn[standard]>=0.40,<0.41",
    "python-multipart>=0.0.21,<0.0.22",
    # Database
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.31,<0.32",
    "pgvector>=0.4,<0.5",
    "alembic>=1.18,<1.19",
    # Cache & queue
    "celery[redis]>=5.6,<5.7",
    "vine>=5.1,<5.2",
    "redis>=6.4,<6.5",
    # Auth
    "python-jose[cryptography]>=3.5,<3.6",
    "passlib[bcrypt]>=1.7,<1.8",
    "bcrypt>=4.3,<4.4",
    # LLM providers
    "openai>=2.33,<2.34",
    "anthropic>=0.97,<0.98",
    "tiktoken>=0.12,<0.13",
    # Document processing
    "pymupdf>=1.27,<1.28",
    "python-docx>=1.2,<1.3",
    "beautifulsoup4>=4.14,<4.15",
    # Settings
    "pydantic-settings>=2.14,<2.15",
    "email-validator>=2.3,<2.4",
    "httpx>=0.28,<0.29",
    # Observability
    "langfuse>=4.5,<4.6",
]

[project.optional-dependencies]
gpu = [
    "FlagEmbedding>=1.2",
    "sentence-transformers>=3.0",
    "torch>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require external providers or full services",
]
